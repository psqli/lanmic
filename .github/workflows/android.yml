name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install the server's dependencies
        run: pip install -r server/requirements.txt

      # Covers everything in the engine except the two Oboe streams, plus the
      # Python server, plus clippy and rustfmt.
      - name: Run the test suites
        run: tools/run_tests.sh --strict

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships an Android SDK; this pins the pieces we need.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Gradle shells out to this to build the engine for each packaged ABI.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # The engine links with -Wl,--no-undefined, so an unresolved symbol fails
      # the build rather than dlopen on a device. This checks the other half:
      # that the library is actually packaged, for every ABI we claim.
      - name: Check the engine is packaged for every ABI
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" "lib/$abi/liblanmic.so" | grep -q liblanmic.so \
              || { echo "::error::liblanmic.so missing for $abi"; exit 1; }
            echo "ok: lib/$abi/liblanmic.so"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lanmic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
