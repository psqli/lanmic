name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships an Android SDK; this pins the pieces we need.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run the host tests for the C++ core
        run: |
          cd tools
          g++ -std=c++17 -O2 -Wall -Wextra -I../app/src/main/cpp \
              host_test.cpp ../app/src/main/cpp/udp_socket.cpp -o host_test -lpthread
          ./host_test

      - uses: actions/upload-artifact@v4
        with:
          name: lanmic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
